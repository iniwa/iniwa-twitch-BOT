<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Iniwa's Twitch BOT{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    {% block extra_css %}{% endblock %}
    {% block extra_head %}{% endblock %}
</head>
<body class="layout-b">

    <div id="top-bar">
        <a href="/" class="brand">🎮 Twitch BOT</a>
        <div class="nav-links">
            <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">📊 ダッシュボード</a>
            <a href="/analytics" class="nav-link {% if '/analytics' in request.path %}active{% endif %}">📈 アナリティクス</a>
        </div>
        <div class="spacer"></div>
        <div class="status-area">
            <span id="live-badge" class="live-off" role="status" aria-live="polite">●OFF</span>
            <span id="top-game"></span>
            <span id="top-viewers">👁 0</span>
        </div>
        {% if obs_archive_enabled %}
        <form action="/toggle_admin_mode" method="post" style="display:inline; margin-left:6px;">
            <button type="submit" class="btn" style="font-size:0.78em; padding:3px 8px; {% if admin_mode %}background:rgba(230,126,34,0.25); color:#e67e22; border-color:rgba(230,126,34,0.5);{% else %}opacity:0.6;{% endif %}">管理者モード: {{ 'ON' if admin_mode else 'OFF' }}</button>
        </form>
        {% endif %}
        {% block top_bar_extras %}{% endblock %}
        <button id="layout-toggle" onclick="toggleLayout()" title="モニターモードへ切り替え">📡</button>
    </div>

    <div id="toast-container"></div>

    {% block content %}{% endblock %}

    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
